name = "trackcodex-site-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# R2 Bucket binding
[[r2_buckets]]
binding = "SITES_BUCKET"
bucket_name = "trackcodex-sites"

# KV Namespace binding
[[kv_namespaces]]
binding = "SITE_ROUTING"
id = ""  # Fill with your KV namespace ID from Cloudflare dashboard

# Custom domain routing
# routes = [
#   { pattern = "*.trackcodex.com", zone_name = "trackcodex.com" }
# ]

[vars]
ANALYTICS_ENDPOINT = "https://api.trackcodex.com/api/v1/infra/analytics/ingest"
ANALYTICS_SECRET = "super-secret-worker-token-123"
